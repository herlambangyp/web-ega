                let products =

                    {
                      title: "Metal-Clad Switchgear",
                      kategori :"Metal Closed",
                      image: "assets/img/product/BBVT.webp",
                      altImage: "Metal-clad switchgear", // Hmmm kebnayakan sama dengan title, Jadi tidak harus ada data altImage. Dan jika tidak ada altImage, datanya diisi title
                      descInd: "Switchgear berkompartemen untuk distribusi tegangan menengah yang terkendali dan andal.",
                      descEn: "Compartmentalized switchgear designed for controlled and reliable medium-voltage distribution.",
                      modalTarget: "metalCladModal",
                      modalBody :`<p en="Metal-clad switchgear uses grounded metal barriers to separate major components and supports dependable operation, inspection, and maintenance." ind="Metal-clad switchgear menggunakan pembatas logam yang ditanahkan untuk memisahkan komponen utama serta mendukung operasi, inspeksi, dan pemeliharaan yang andal."></p><ul><li en="Medium-voltage distribution" ind="Distribusi tegangan menengah"></li><li en="Protection, metering, and control integration" ind="Integrasi proteksi, metering, dan kontrol"></li><li en="Project-specific feeder arrangement" ind="Susunan feeder sesuai kebutuhan proyek"></li></ul>`,
                      sertif: true,
                      height: "2160 mm",
                      width: "750 mm",
                      length: "2050 mm",
                      certified: "SPLN D3.020-1:2019",
                      psu: "60-240v AC/DC",
                      io: "6 Inputs/Outputs",
                      interface: "10 status LEDs"
                    },
                    {
                      title: "Air-Insulated Switchgear",
                      kategori :"Metal Closed",
                      image: "assets/img/product/PBF.webp",
                      altImage: "Air-insulated switchgear",
                      descInd: "Konfigurasi AIS type-tested dan khusus proyek untuk aplikasi utilitas serta industri.",
                      descEn: "Type-tested and project-specific AIS configurations for utility and industrial applications.",
                      modalTarget: "aisModal",
                      modalBody: `<p en="AIS uses air as the primary insulation medium and is available in type-tested or project-specific configurations." ind="AIS menggunakan udara sebagai media insulasi utama dan tersedia dalam konfigurasi type-tested maupun khusus proyek.">AIS menggunakan udara sebagai media insulasi utama dan tersedia dalam konfigurasi type-tested maupun khusus proyek.</p><ul><li>20 kV application</li><li en="Type-tested option" ind="Opsi type-tested">Opsi type-tested</li><li en="Non-type-tested or retrofit configuration" ind="Konfigurasi non-type-tested atau retrofit">Konfigurasi non-type-tested atau retrofit</li></ul>`,
                      sertif: true,
                      height: "2160 mm",
                      width: "750 mm",
                      length: "2050 mm",
                      certified: "SPLN D3.020-1:2019",
                      psu: "60-240v AC/DC",
                      io: "6 Inputs/Outputs",
                      interface: "10 status LEDs"
                    },
                    {
                      title: "Fully Insulated Switchgear",
                      kategori :"Metal Closed",
                      image: "assets/img/product/CAKRA.webp",
                      altImage: "Fully insulated switchgear",
                      descInd: "Switchgear ringkas dan terlindungi untuk instalasi yang membutuhkan efisiensi ruang.",
                      descEn: "Compact protected switchgear for installations requiring efficient use of space.",
                      modalTarget: "fisModal",
                      modalBody:`<p en="Fully insulated switchgear provides a compact protected arrangement suited to installations with limited space or challenging environmental conditions." ind="Fully insulated switchgear memberikan susunan ringkas dan terlindungi untuk instalasi dengan keterbatasan ruang atau kondisi lingkungan yang menantang.">Fully insulated switchgear memberikan susunan ringkas dan terlindungi untuk instalasi dengan keterbatasan ruang atau kondisi lingkungan yang menantang.</p><ul><li en="Compact arrangement" ind="Susunan ringkas">Susunan ringkas</li><li en="Protected primary components" ind="Komponen primer terlindungi">Komponen primer terlindungi</li><li en="Type-tested and project-specific options" ind="Opsi type-tested dan khusus proyek">Opsi type-tested dan khusus proyek</li></ul>`,
                      sertif: true,
                      height: "2160 mm",
                      width: "750 mm",
                      length: "2050 mm",
                      certified: "SPLN D3.020-1:2019",
                      psu: "60-240v AC/DC",
                      io: "6 Inputs/Outputs",
                      interface: "10 status LEDs"
                    },
                    {
                      title: "Current Transformer",
                      kategori :"Metal Enclosed",
                      image: "assets/img/product/CK-2000.webp",
                      altImage: "Current transformer",
                      descInd: "Trafo instrumen untuk pengukuran arus, metering, dan sistem proteksi.",
                      descEn: "Instrument transformer for current measurement, metering, and protection systems.",
                      modalTarget: "ctModal",
                      modalBody:`<p en="Current transformers convert primary current into a proportional secondary value for measurement, metering, and protection devices." ind="Current transformer mengubah arus primer menjadi nilai sekunder yang proporsional untuk perangkat pengukuran, metering, dan proteksi.">Current transformer mengubah arus primer menjadi nilai sekunder yang proporsional untuk perangkat pengukuran, metering, dan proteksi.</p><ul><li en="Metering application" ind="Aplikasi metering">Aplikasi metering</li><li en="Protection application" ind="Aplikasi proteksi">Aplikasi proteksi</li><li en="Ratio and class selected according to project requirements" ind="Rasio dan kelas dipilih sesuai kebutuhan proyek">Rasio dan kelas dipilih sesuai kebutuhan proyek</li></ul>`,
                      height: "2160 mm",
                      width: "750 mm",
                      length: "2050 mm",
                      certified: "SPLN D3.020-1:2019",
                      psu: "60-240v AC/DC",
                      io: "6 Inputs/Outputs",
                      interface: "10 status LEDs"
                    },
                    {
                      title: "Voltage Transformer",
                      kategori :"Metal Enclosed",
                      image: "assets/img/product/PBIF.webp",

                      descInd: "Trafo instrumen untuk kebutuhan pengukuran tegangan, metering, dan proteksi.",
                      descEn: "Instrument transformer for voltage measurement, metering, and protection requirements.",
                      modalTarget: "vtModal",
                      modalBody:`<p en="Voltage transformers provide a proportional secondary voltage for metering, indication, and protection equipment." ind="Voltage transformer menyediakan tegangan sekunder yang proporsional untuk peralatan metering, indikasi, dan proteksi.">Voltage transformer menyediakan tegangan sekunder yang proporsional untuk peralatan metering, indikasi, dan proteksi.</p><ul><li en="Voltage measurement" ind="Pengukuran tegangan">Pengukuran tegangan</li><li en="Metering and protection application" ind="Aplikasi metering dan proteksi">Aplikasi metering dan proteksi</li><li en="Configuration selected according to the system" ind="Konfigurasi dipilih sesuai sistem">Konfigurasi dipilih sesuai sistem</li></ul>`,
                      height: "2160 mm",
                      width: "750 mm",
                      length: "2050 mm",
                      certified: "SPLN D3.020-1:2019",
                      psu: "60-240v AC/DC",
                      io: "6 Inputs/Outputs",
                      interface: "10 status LEDs"
                    },
                    {
                      title: "kWh Meter",
                      kategori :"Metal Enclosed",
                      image: "assets/img/product/PBVT.webp",
                      altImage: "kWh meter",
                      descInd: "Solusi metering untuk memantau dan mencatat konsumsi energi listrik.",
                      descEn: "Energy metering solution for monitoring and recording electrical energy consumption.",
                      modalTarget: "meterModal",
                      modalBody:`<p en="The kWh meter records electrical energy usage for monitoring, billing, and energy management applications." ind="kWh meter mencatat pemakaian energi listrik untuk aplikasi pemantauan, penagihan, dan pengelolaan energi.">kWh meter mencatat pemakaian energi listrik untuk aplikasi pemantauan, penagihan, dan pengelolaan energi.</p><ul><li en="Energy consumption recording" ind="Pencatatan konsumsi energi">Pencatatan konsumsi energi</li><li en="Panel and system integration" ind="Integrasi panel dan sistem">Integrasi panel dan sistem</li><li en="Configuration according to project requirements" ind="Konfigurasi sesuai kebutuhan proyek">Konfigurasi sesuai kebutuhan proyek</li></ul>`,
                      height: "2160 mm",
                      width: "750 mm",
                      length: "2050 mm",
                      certified: "SPLN D3.020-1:2019",
                      psu: "60-240v AC/DC",
                      io: "6 Inputs/Outputs",
                      interface: "10 status LEDs"
                    }
                  ]
                function loopProduk(kelas, kategori, template="productTemplate") {
                  let htmlTemplate = document.getElementById(template).innerHTML,
                  produkTerfilter=[]
                  console.log('funngsi lop dipanggil. Target Loop = ', kelas)
                  if(!kategori || kategori === "all"){produkTerfilter = products}
                  else{
                    produkTerfilter = products.filter(product => product.kategori === kategori)
                    console.log('data produk terfilter = ',produkTerfilter)
                  }
                  document.querySelector(kelas).innerHTML = produkTerfilter.map(product => {
                    // Tidak ada proteksi XSS. Jika ada backend, ambil alih logika looping ini di backend, atau jika logika looping tetap diserahkan fungsi ini, pastikan yang bisa mengupload product "cuma admin"
                    // jika hanya ada front-end (tidak ada back-end), fungsi ini 100000000% aman
                    return htmlTemplate
                    .replaceAll('{{title}}', product.title)
                    .replaceAll('{{image}}', product.image)
                    .replaceAll('{{altImage}}', product.altImage || product.title)
                    .replaceAll('{{descInd}}', product.descInd)
                    .replaceAll('{{descEn}}', product.descEn)
                    .replaceAll('{{modalTarget}}', product.modalTarget)
                    .replaceAll('{{modalBody}}', product.modalBody)
                    .replaceAll('{{blueIcon}}', product.sertif? "blueIcon" : "")
                    .replaceAll('{{gradient}}', product.sertif? "blueGradient" : "orangeGradient")
                    .replaceAll('{{height}}', product.height)
                    .replaceAll('{{width}}', product.width)
                    .replaceAll('{{length}}', product.length)
                    .replaceAll('{{certified}}', product.certified)
                    .replaceAll('{{psu}}', product.psu)
                    .replaceAll('{{io}}', product.io)
                    .replaceAll('{{interface}}', product.interface)
                  }).join('')}
              </script>
